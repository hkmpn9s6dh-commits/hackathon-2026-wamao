<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>一口云 · 三张设计稿（阅稿页）</title>
<style>
  :root { --paper:#F4F1EA; --ink:#23231F; --ink2:#5A574E; --rule:#C6BFB0; --zhu:#A63A2B; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font-family: "Noto Serif SC","Songti SC",serif; }
  header { padding: 56px 24px 24px; max-width: 900px; margin: 0 auto; }
  .k { font-family: system-ui, sans-serif; font-size:12px; letter-spacing:.22em; color:var(--ink2); }
  h1 { font-size: 44px; letter-spacing:.08em; margin:12px 0 8px; font-weight:500; }
  .s { color:var(--ink2); font-size:15px; line-height:1.8; letter-spacing:.04em; }
  .rule { height:1px; background:var(--rule); margin:28px 0 0; }
  main { max-width: 900px; margin: 0 auto; padding: 28px 24px 80px; }
  figure { margin: 0 0 56px; }
  figure img { width:100%; height:auto; display:block; box-shadow: 0 8px 40px rgba(0,0,0,.12); }
  figcaption { display:flex; gap:16px; align-items:baseline; margin-top:14px;
               font-size:13px; color:var(--ink2); letter-spacing:.04em; }
  figcaption b { font-family: system-ui, sans-serif; color:var(--zhu); font-size:12px; letter-spacing:.14em; font-weight:500; }
  footer { max-width:900px; margin:0 auto; padding:0 24px 64px; font-size:12px; color:var(--ink2); line-height:1.9; }
  a { color:var(--zhu); text-decoration:none; border-bottom:1px solid rgba(166,58,43,.3); }
</style>
</head>
<body>
<header>
  <div class="k">望见云首届瓦猫 AI 创作大赛　·　AI 设计赛道　专业组</div>
  <h1>一口云</h1>
  <p class="s">瓦猫只做一件事：把外面的东西，变成屋里的东西。过去它吞风、吞灾；<br>
  现在它蹲在云下面，还是那张嘴。</p>
  <div class="rule"></div>
</header>

<main>
  <figure>
    <img src="output/01-hero.png" alt="一口云 主视觉">
    <figcaption><b>01</b><span>主视觉 · 瓦猫蹲在青瓦屋脊端头，口中涌出一条云，云升到天上去</span></figcaption>
  </figure>
  <figure>
    <img src="output/02-craft.png" alt="一口云 工艺考据">
    <figcaption><b>02</b><span>工艺考据 · 胎、火、脊——它不是塑像，是瓦</span></figcaption>
  </figure>
  <figure>
    <img src="output/03-future.png" alt="一口云 未来概念">
    <figcaption><b>03</b><span>未来概念 · 云口可换、云腹是窑、云瓦归还</span></figcaption>
  </figure>
</main>

<footer>
  三张均为 2480×3508 / 300dpi。图像由 AI 生成，版式与文字用 HTML/CSS 编排，字体 Noto Serif SC / Noto Sans SC（SIL OFL 1.1）。<br>
  复验：<a href="https://github.com/hkmpn9s6dh-commits/hackathon-2026-wamao">github.com/hkmpn9s6dh-commits/hackathon-2026-wamao</a>
</footer>
</body>
</html>
